{# Version selector for a Terraform provider page.
   Inputs: provider, version, version_anchors (dict of version -> [doc_slugs]). #}
<div class="tf-version-selector">
  <label for="tf-version-select">Version</label>
  <select id="tf-version-select"
          data-provider-slug="{{ provider.slug }}"
          data-current-version="{{ version.version }}">
    {% for v in provider.versions %}
      <option value="{{ v.version }}"{% if v.version == version.version %} selected{% endif %}>
        {{ v.version }}{% if v.is_latest %} (latest){% endif %}
      </option>
    {% endfor %}
  </select>
  <script type="application/json" id="tf-version-anchors">{{ version_anchors | tojson }}</script>
  <script>
    (function () {
      var sel = document.getElementById('tf-version-select');
      if (!sel) return;
      var anchorsEl = document.getElementById('tf-version-anchors');
      var anchors = anchorsEl ? JSON.parse(anchorsEl.textContent) : {};
      sel.addEventListener('change', function () {
        var target = sel.value;
        var current = sel.dataset.currentVersion;
        if (target === current) return;
        var hash = window.location.hash;
        var fragment = '';
        if (hash.indexOf('#doc-') === 0) {
          fragment = hash.slice('#doc-'.length);
        }
        var slugs = anchors[target] || [];
        var has = fragment && slugs.indexOf(fragment) !== -1;
        var url = target + '.html' + (has ? '#doc-' + fragment : '');
        window.location.href = url;
      });
    })();
  </script>
</div>
